name: Build MiniLinux-CPE console APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/build-apk.yml"
      - "Makefile"
      - "ci.config"
      - "files/**"
      - "luci-app/**"

concurrency:
  group: console-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      IMMORTALWRT_COMMIT: 3a0f609352e0b582fc670af865ad449a65b18e62
      BUILD_DIR: ${{ github.workspace }}/.ci/immortalwrt
      DL_CACHE_DIR: ${{ github.workspace }}/.ci/downloads

    steps:
      - name: Checkout console source
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -name '*.list' -delete
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools rsync swig \
            unzip zlib1g-dev file wget curl jq libelf-dev dwarves \
            device-tree-compiler patch ca-certificates

      - name: Restore source download cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DL_CACHE_DIR }}
          key: cpe-console-dl-${{ env.IMMORTALWRT_COMMIT }}-${{ hashFiles('ci.config') }}
          restore-keys: |
            cpe-console-dl-${{ env.IMMORTALWRT_COMMIT }}-

      - name: Prepare ImmortalWrt 25.12
        run: |
          git clone --branch openwrt-25.12 --filter=blob:none \
            https://github.com/immortalwrt/immortalwrt.git "$BUILD_DIR"
          git -C "$BUILD_DIR" checkout --detach "$IMMORTALWRT_COMMIT"
          mkdir -p "$DL_CACHE_DIR"
          ln -s "$DL_CACHE_DIR" "$BUILD_DIR/dl"
          cd "$BUILD_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/yang-cpe-console/files
          cp "$GITHUB_WORKSPACE/Makefile" package/yang-cpe-console/Makefile
          cp -a "$GITHUB_WORKSPACE/files/." package/yang-cpe-console/files/
          mkdir -p package/luci-app-yang-cpe-console
          cp -a "$GITHUB_WORKSPACE/luci-app/." package/luci-app-yang-cpe-console/
          cp "$GITHUB_WORKSPACE/ci.config" .config
          make defconfig
          grep -q '^CONFIG_TARGET_ramips_mt76x8_DEVICE_hilink_hlk-7628n=y$' .config
          grep -q '^CONFIG_PACKAGE_yang-cpe-console=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-yang-cpe-console=y$' .config
          sh -n package/yang-cpe-console/files/cpectl

      - name: Download package sources
        run: |
          cd "$BUILD_DIR"
          make download -j4
          find dl -type f -size -1024c -delete

      - name: Build console package
        run: |
          cd "$BUILD_DIR"
          mkdir -p logs
          set -o pipefail
          make package/yang-cpe-console/compile package/luci-app-yang-cpe-console/compile -j4 \
            2>&1 | tee logs/package-build.log

      - name: Collect APK
        run: |
          mkdir -p dist
          find "$BUILD_DIR/bin/packages" -type f \
            \( -name 'yang-cpe-console-*.apk' -o -name 'luci-app-yang-cpe-console-*.apk' \) \
            -exec cp -f {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name 'yang-cpe-console-*.apk' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'luci-app-yang-cpe-console-*.apk' -print -quit)"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Upload console APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-yang-cpe-console-1.0.0-ramips-mt76x8
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-build-logs
          path: ${{ env.BUILD_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 14
